name: Lodestock
version: ${version}
main: io.github.direkjames.lodestock.paper.LodestockPlugin
api-version: '1.21.11'
authors: [ direkjames ]
description: A stock market for ores. A rework of OreMarket by OllieJW.
depend: [ Vault ]
softdepend: [ Essentials ]

commands:
  lodestock:
    description: Lodestock market commands
    usage: /<command> [help|open|price|limits|sellhand|sellall|setprice|setstock|reset|crash|surge|stats|history|reload]
    aliases: [market, openmarket]

permissions:
  lodestock.use:
    description: Open the market and check prices
    default: true
  lodestock.buy:
    description: Buy in the GUI
    default: true
  lodestock.sell.gui:
    description: Sell in the GUI
    default: true
  lodestock.sell.hand:
    description: Use /lodestock sellhand
    default: true
  lodestock.sell.all:
    description: Use /lodestock sellall
    default: true
  lodestock.sell.*:
    description: All selling permissions
    default: false
    children:
      lodestock.sell.gui: true
      lodestock.sell.hand: true
      lodestock.sell.all: true
  lodestock.limit.bypass:
    description: Not affected by daily buy and sell limits
    default: op
  lodestock.admin.reload:
    default: op
  lodestock.admin.setprice:
    default: op
  lodestock.admin.setstock:
    default: op
  lodestock.admin.reset:
    default: op
  lodestock.admin.crash:
    default: op
  lodestock.admin.surge:
    default: op
  lodestock.admin.stats:
    default: op
  lodestock.admin.history:
    default: op
  lodestock.admin.*:
    description: All admin permissions
    default: op
    children:
      lodestock.admin.reload: true
      lodestock.admin.setprice: true
      lodestock.admin.setstock: true
      lodestock.admin.reset: true
      lodestock.admin.crash: true
      lodestock.admin.surge: true
      lodestock.admin.stats: true
      lodestock.admin.history: true