# Shown wherever a message contains <prefix>. Change it here, or remove <prefix> from a message to hide it.
prefix: "<gray>[<gold>Lodestock<gray>] "

help: "<gold>Lodestock help<newline><yellow>/lodestock<gray> - open the market<newline><yellow>/lodestock price <item><gray> - price and stock of one item<newline><yellow>/lodestock limits<gray> - what you can still buy and sell today<newline><yellow>/lodestock chart <item> [24h|7d|all]<gray> - price history<newline><yellow>/lodestock sellhand<gray> - sell the stack in your hand<newline><yellow>/lodestock sellall<gray> - sell everything the market buys in your inventory"
help-admin: "<gold>Admin commands<newline><yellow>/lodestock setprice <item> <price><newline><yellow>/lodestock setstock <item> <amount><newline><yellow>/lodestock reset <item> <gray>(or all)<newline><yellow>/lodestock crash <percent> [item]<newline><yellow>/lodestock surge <percent> [item]<newline><yellow>/lodestock stats<newline><yellow>/lodestock history <player> [page]<newline><yellow>/lodestock audit<gray> - check the setup for money exploits<newline><yellow>/lodestock economy [24h|7d|30d]<gray> - how much money the market created<newline><yellow>/lodestock reload"
no-permission: "<prefix><red>You don't have permission to do that."
unknown-subcommand: "<prefix><red>Unknown command. Try <yellow>/lodestock help<red>."
player-only: "<prefix><red>Only players can do that."

reloaded: "<prefix><green>Reloaded. <items> items loaded."
reload-failed: "<prefix><red>Reload failed, the old settings are still in use. Check the console."
