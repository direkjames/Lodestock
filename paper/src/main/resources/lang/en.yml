audit:
  way-buy-first: "buying then selling"
  way-sell-first: "selling then buying back"
  tax-zero: "tax-percent is 0, so selling costs nothing and buying and selling is free. Set it to 10 or more."
  tax-low: "tax-percent is only <tax>%, so a buy and sell loses almost nothing. 10 or more is safer."
  multiplier-high: "multiplier is <value>, so one trade moves a price a lot and big trades can swing it. 0.01 to 0.02 is typical."
  floor-low: "price-floor is <floor> but your cheapest item costs <cheapest>. Prices can crash to almost nothing and be bought up cheap. Try about 5 to 10 percent of your cheapest item."
  renewable-no-limits: "Prices and stock recover by themselves and there are no daily limits, so a player with an endless item source can sell every cycle. Add limits.daily-sell or a daily-sell per item."
  round-trip: "<item>: <way> <amount> makes <profit> from nothing. Raise tax-percent or lower multiplier."
  crafting-loop: "Buy <from>, turn it into <to> and sell it: <profit> profit each time. Raise the price of <from> or lower <to>."
  crafting-loop-now: "Right now (prices are off after a crash, surge or heavy trading): buy <from>, turn it into <to> and sell it for <profit> profit each time."
