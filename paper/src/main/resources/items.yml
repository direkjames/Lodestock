# Each key is a Minecraft item ID, such as diamond or iron_ingot ("minecraft:" is optional).
# The key is also how prices are saved. Renaming a key starts that item over at its base price and stock.
#
# Settings for each item:
#   base-price   price when the market is fresh (required, above 0)
#   start-stock  how many the market starts with (required)
#   max-stock    the market stops buying from players at this amount (required)
#   allow-buy    false = players can't buy it (optional)
#   allow-sell   false = players can't sell it (optional)
#   slot         pin the item to an exact slot in the GUI, counting from 0 (optional)
#   page         the page for that slot, default 1 (optional)

coal:
  base-price: 3.0
  start-stock: 200
  max-stock: 2000
copper_ingot:
  base-price: 4.0
  start-stock: 200
  max-stock: 2000
iron_ingot:
  base-price: 8.0
  start-stock: 150
  max-stock: 1500
gold_ingot:
  base-price: 20.0
  start-stock: 100
  max-stock: 1000
lapis_lazuli:
  base-price: 5.0
  start-stock: 150
  max-stock: 1500
redstone:
  base-price: 3.0
  start-stock: 200
  max-stock: 2000
amethyst_shard:
  base-price: 8.0
  start-stock: 100
  max-stock: 1000
emerald:
  base-price: 40.0
  start-stock: 50
  max-stock: 500
diamond:
  base-price: 80.0
  start-stock: 50
  max-stock: 500
quartz:
  base-price: 6.0
  start-stock: 150
  max-stock: 1500
netherite_scrap:
  base-price: 150.0
  start-stock: 20
  max-stock: 200

