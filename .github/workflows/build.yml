name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Find the plugin jar
        run: |
          JAR=$(find paper/build/libs -name 'Lodestock-Paper*.jar' ! -name '*plain*' | head -n 1)
          test -n "$JAR" || { echo "Plugin jar not found"; exit 1; }
          mkdir -p dist && cp "$JAR" dist/
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Check our classes are Java 21
        run: |
          mkdir -p /tmp/check && cd /tmp/check
          unzip -q "$GITHUB_WORKSPACE/$JAR" \
            'io/github/direkjames/lodestock/paper/*' 'io/github/direkjames/lodestock/core/*' 'io/github/direkjames/lodestock/api/*'
          for f in $(find . -name '*.class'); do
            major=$(javap -v "$f" | grep 'major version' | awk '{print $3}')
            if [ "$major" != "65" ]; then
              echo "$f is class version $major, expected 65 (Java 21)"
              exit 1
            fi
          done
          echo "All classes are Java 21."

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Lodestock-Paper
          path: dist/*.jar