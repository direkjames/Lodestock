# Lodestock items.yml preset: Generous (high income)
#
# Good for: Servers with a rich economy: expensive ranks, kits and land. Prices are 4 times the balanced ones.
#
# How to use: replace the contents of plugins/Lodestock/items.yml with this file, then also copy the
# config.yml settings from docs/ECONOMY.md (they matter just as much as the prices). Run /lodestock reload
# and then /lodestock audit. Prices already saved by the market stay until you run /lodestock reset all confirm.
#
# The prices follow the crafting rules, so nobody can make money by crafting:
#   - a block costs exactly 9 times its ingot, a raw ore costs the same as its ingot
#   - blocks do not regenerate stock (regen: false), so they cannot out-pay the ingots
#   - raw ores get half the stock room of ingots, so one material cannot pay out three times over
# daily-sell is how many one player can sell of that item per day. It is roughly the same amount of
# money for every item, so cheap items allow more. Raise or lower them, or delete them to remove the limit.

